name: Feature request
description: An idea for Unclouded
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to know or do?
      description: Describe the situation, for example the kind of device or automation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Unclouded help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
